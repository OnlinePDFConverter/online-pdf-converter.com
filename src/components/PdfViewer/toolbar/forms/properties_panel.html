<aside class="pv-forms-properties-panel" data-forms-properties-panel aria-labelledby="<%= panelTitleId %>" hidden>
    <header class="pv-forms-properties-header">
        <h3 id="<%= panelTitleId %>"><%= title %></h3>
        <button class="pv-forms-properties-close" type="button" data-properties-close
            title="<%= closeLabel %>" aria-label="<%= closeLabel %>">×</button>
    </header>
    <div class="pv-forms-properties-body">
        <%= body %>
    </div>
</aside>
