<div class="pv-watermark-editor p-5">
    <div class="pv-watermark-tabs" role="tablist" aria-label="<%= typeLabel %>">
        <button id="<%= idPrefix %>-tab-text" class="pv-watermark-tab is-active" type="button"
            role="tab" aria-selected="true" aria-controls="<%= idPrefix %>-panel-text" data-watermark-tab="text">
            <%= typeText %>
        </button>
        <button id="<%= idPrefix %>-tab-image" class="pv-watermark-tab" type="button" role="tab"
            aria-selected="false" aria-controls="<%= idPrefix %>-panel-image" tabindex="-1" data-watermark-tab="image">
            <%= typeImage %>
        </button>
    </div>

    <label class="pv-watermark-check pv-watermark-all-pages">
        <input type="checkbox" data-watermark-all-pages>
        <span><%= applyAllPages %></span>
    </label>

    <section id="<%= idPrefix %>-panel-text" class="pv-watermark-panel" role="tabpanel"
        aria-labelledby="<%= idPrefix %>-tab-text" data-watermark-panel="text">
        <label class="pv-watermark-field pv-watermark-text-field">
            <span><%= textLabel %></span>
            <input class="input input-border" type="text" maxlength="120" value="CONFIDENTIAL" data-watermark-text>
        </label>
        <div class="pv-watermark-fields-row">
            <label class="pv-watermark-field">
                <span><%= fontSize %></span>
                <input class="input input-border" type="number" min="8" max="300" step="1" value="50" data-watermark-font-size>
            </label>
            <label class="pv-watermark-color-field">
                <span><%= color %></span>
                <input type="color" value="#999999" data-watermark-color>
            </label>
        </div>
    </section>

    <section id="<%= idPrefix %>-panel-image" class="pv-watermark-panel pv-d-none" role="tabpanel"
        aria-labelledby="<%= idPrefix %>-tab-image" data-watermark-panel="image" hidden>
        <input class="pv-watermark-image-input" type="file" accept="image/png,image/jpeg" tabindex="-1" data-watermark-image>
        <div class="pv-watermark-image-picker" data-watermark-image-picker>
            <button class="pv-watermark-image-upload" type="button" data-watermark-image-trigger>
                <%= imageEmpty %>
            </button>
            <img class="pv-d-none" alt="<%= imageAlt %>" data-watermark-image-preview>
            <div class="pv-watermark-preview-tiles" aria-hidden="true" data-watermark-image-preview-tiles></div>
        </div>
        <button class="btn btn-sm btn-outline btn-red-outline pv-watermark-image-clear pv-d-none" type="button"
            data-watermark-image-clear><%= clearImage %></button>
    </section>

    <div class="pv-watermark-preview" aria-label="<%= previewLabel %>" data-watermark-preview>
        <span data-watermark-preview-text>CONFIDENTIAL</span>
        <div class="pv-watermark-preview-tiles" aria-hidden="true" data-watermark-preview-tiles></div>
    </div>

    <div class="pv-watermark-settings-grid">
        <label class="pv-watermark-range-field">
            <span><%= opacity %>: <output data-watermark-opacity-value>30%</output></span>
            <input type="range" min="0.05" max="1" step="0.05" value="0.3" data-watermark-opacity>
        </label>
        <label class="pv-watermark-range-field">
            <span><%= angle %>: <output data-watermark-angle-value>-45°</output></span>
            <input type="range" min="-180" max="180" step="1" value="-45" data-watermark-angle>
        </label>
    </div>

    <fieldset class="pv-watermark-position" data-watermark-position-group>
        <legend><%= position %></legend>
        <% positions.forEach(item => { %>
            <label>
                <input type="radio" name="<%= idPrefix %>-position" value="<%= item.value %>"
                    <%= item.value === 'center' ? 'checked' : '' %>>
                <span><%= item.label %></span>
            </label>
        <% }); %>
    </fieldset>

    <label class="pv-watermark-check pv-watermark-tile">
        <input type="checkbox" data-watermark-tile>
        <span><%= tile %></span>
    </label>

    <div class="pv-watermark-existing pv-d-none" data-watermark-existing>
        <span><%= existingWatermark %></span>
        <button class="btn btn-sm btn-outline btn-red-outline" type="button" data-watermark-clear><%= clearWatermark %></button>
    </div>
</div>
