<div id="<%= panelId %>" class="pv-editor-secondary-toolbar pv-shapes-toolbar" role="toolbar" aria-label="<%= label %>" hidden>
    <% tools.forEach(function(tool) { %><button type="button" data-editor-tool="<%= tool.type %>" title="<%= tool.label %>" aria-pressed="false"><%= icons[tool.type] %><span><%= tool.label %></span></button><% }); %>

    </button>
    <button type="button" data-editor-command="redo" title="<%= redo %>">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path d="M170.34,130.34,204.69,96H88a48,48,0,0,0,0,96h88a8,8,0,0,1,0,16H88A64,64,0,0,1,88,80H204.69L170.34,45.66a8,8,0,0,1,11.32-11.32l48,48a8,8,0,0,1,0,11.32l-48,48a8,8,0,0,1-11.32-11.32Z"></path></svg>

</div>
